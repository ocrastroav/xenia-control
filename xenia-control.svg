<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="blade" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- fondo redondeado -->
  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="26.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- ventilador: 3 aspas + cubo -->
  <g transform="translate(64,65)">
    <g fill="url(#blade)">
      <path d="M0,0 C 16,-8 31,-28 7,-47 C -2,-31 -10,-14 0,0 Z"/>
      <path d="M0,0 C 16,-8 31,-28 7,-47 C -2,-31 -10,-14 0,0 Z" transform="rotate(120)"/>
      <path d="M0,0 C 16,-8 31,-28 7,-47 C -2,-31 -10,-14 0,0 Z" transform="rotate(240)"/>
    </g>
    <circle r="11" fill="#e2e8f0"/>
    <circle r="4.5" fill="#0b1120"/>
  </g>

  <!-- rayo de rendimiento (esquina) -->
  <path d="M95,30 l-15,20 h9 l-5,17 18,-24 h-9 z"
        fill="#facc15" stroke="#0b1120" stroke-width="2" stroke-linejoin="round"/>
</svg>
